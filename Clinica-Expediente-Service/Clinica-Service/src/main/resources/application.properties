spring.application.name=Clinica-Service
server.port=8084

# Conexi\u00c3\u00b3n a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/clinica_db
spring.datasource.username=postgres
spring.datasource.password=1346
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuraci\u00c3\u00b3n Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# URLs de los otros microservicios
app.medicos-service.url=http://localhost:8081
app.pacientes-service.url=http://localhost:8082
app.citas-service.url=http://localhost:8083